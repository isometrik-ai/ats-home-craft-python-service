name: Python App Lint & Test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

env:
  REGISTRY: docker.io

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # - name: Run SonarQube Scan
      #   uses: SonarSource/sonarqube-scan-action@v5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  docker-build-prod:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - service: user-service
            dockerfile: docker/user_service.Dockerfile
            image_repo: ats-home-craft-python-service
          - service: work-order-service
            dockerfile: docker/work_order_service.Dockerfile
            image_repo: ats-home-craft-work-order-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_repo }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_repo }}:prod-${{ github.run_number }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            BUILD_ENV=production
            BUILD_VERSION=${{ github.sha }}

      - name: Notify deployment
        run: |
          echo "✅ Production docker build and push completed for ${{ matrix.service }}!"
          echo "📦 Images tagged:"
          echo "   - ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_repo }}:latest"
          echo "   - ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_repo }}:prod-${{ github.run_number }}"
          echo "🔗 Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest
    needs: docker-build-prod
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd /var/www/html/backend-services/python-service
            sudo docker compose pull && sudo docker compose down && sudo docker compose up -d
            echo "✅ Deployment completed successfully!"
