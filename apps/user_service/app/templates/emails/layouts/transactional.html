<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.app_name}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f8;padding:24px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <tr>
            <td style="padding:28px 32px 16px 32px;border-bottom:1px solid #e5e7eb;">
              <p style="margin:0;font-size:20px;font-weight:700;color:#111827;">{{.app_name}}</p>
            </td>
          </tr>
          <tr>
            <td id="body-inject" style="padding:24px 32px;">{{BODY_CONTENT}}</td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px 32px;background-color:#f9fafb;border-top:1px solid #e5e7eb;">
              <p style="margin:0 0 8px 0;font-size:13px;color:#6b7280;text-align:center;">
                Powered by {{.app_name}}
              </p>
              <p style="margin:0;font-size:12px;color:#9ca3af;text-align:center;line-height:1.5;">
                <a href="mailto:{{.support_email}}" style="color:#6b7280;text-decoration:none;">{{.support_email}}</a>
                &nbsp;|&nbsp;
                <a href="{{.company_website}}" style="color:#6b7280;text-decoration:none;">{{.company_website}}</a>
              </p>
              <p style="margin:12px 0 0 0;font-size:11px;color:#9ca3af;text-align:center;">
                Please do not reply to this email.
                &copy; {{.current_year}} {{.company_name}}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
